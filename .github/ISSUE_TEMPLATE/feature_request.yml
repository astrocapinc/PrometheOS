name: Feature request
description: Suggest a change or a new capability.
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: The research problem
      description: What you are trying to do, and where PrometheOS gets in the way today.
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: What you propose
      description: Keep the product boundary in mind; coding agents execute, PrometheOS records and supplies context.
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives you considered
