name: Bug report
description: Something in PrometheOS does not work as documented.
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Please use synthetic data only: no real research, manuscripts, recordings, credentials or personal paths.
        Report security vulnerabilities privately instead (see SECURITY.md).
  - type: textarea
    id: what
    attributes:
      label: What happened
      description: What you did, what you expected and what happened instead.
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: How to reproduce
      description: The commands or steps, with their output. `prometheos doctor --json` output helps (check it for personal paths first).
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Version
      description: Output of `prometheos --version`, or the commit.
    validations:
      required: true
  - type: dropdown
    id: platform
    attributes:
      label: Platform
      options:
        - Windows 11
        - Linux
        - macOS
        - Other
    validations:
      required: true
  - type: input
    id: host
    attributes:
      label: Coding agent or MCP host, if any
      description: For example Claude Code 2.x or OpenCode, with its version.
